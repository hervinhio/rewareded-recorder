name: Sentry Sourcemaps
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:
  sourcemaps:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check committed environment files
        run: yarn check:env-safe

      - name: Build
        run: yarn nx build rewarded-keeper --configuration=production --sourceMap=true
        env:
          NX_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NX_PUBLIC_FIREBASE_API_KEY }}
          NX_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NX_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NX_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NX_PUBLIC_FIREBASE_PROJECT_ID }}
          NX_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NX_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NX_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NX_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NX_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NX_PUBLIC_FIREBASE_APP_ID }}

      - name: Read release version from app version file
        id: release
        shell: bash
        run: |
          set -euo pipefail
          raw_version=$(sed -n "s/^export const version = '\\([^']*\\)';$/\\1/p" apps/rewarded-keeper/src/app/version.js)
          if [ -z "$raw_version" ]; then
            echo "Could not parse app version"
            exit 1
          fi

          case "$raw_version" in
            v*) tag="$raw_version" ;;
            *) tag="v$raw_version" ;;
          esac

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create Sentry release and upload sourcemaps
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ steps.release.outputs.tag }}
          sourcemaps: ./dist/apps/rewarded-keeper
